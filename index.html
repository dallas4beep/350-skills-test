    <style>
:root {
  --bg: #e9e9e7;
  --ink: #111111;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter Tight", system-ui, sans-serif;
}

#scene {
  position: fixed;
  inset: 0;
  display: block;
}

.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 40px;
  z-index: 2;
}

.nav__logo {
  font-weight: 900;
  font-size: 18px;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}

.nav__links {
  display: flex;
  gap: 32px;
  list-style: none;
}

.nav__links a {
  color: var(--ink);

.nav__links a:hover,
.nav__links a:focus-visible {

}

.sr-only {
  position: absolute;
  width: 1px;

}

.meta {

  bottom: 0;

  align-items: center;

  padding: 28px 40px;
  z-index: 2;

  font-weight: 500;
  letter-spacing: 0.06em;

  opacity: 0.6;
}

.meta__label {
  display: flex;
  align-items: center;

}

  display: block;

}

@media (max-width: 640px) {
  .nav,

    padding: 20px 22px;
  }

    flex-direction: column;

  }

  }

  <body>
  <canvas id="scene"></canvas>

<h1 id="headline" class="sr-only">
  <span>My reflections</span>
  <span>and recommendations</span>
</h1>

<nav class="nav">
  <span class="nav__logo">dallas diaz | they/them</span>
  <ul class="nav__links">
    <li><a href="https://docs.google.com/document/d/1jEJTeH7otLG43BM9v5nncmrgMaDeuk_sJldtb6nopbQ/edit?usp=share_link">Overview</a></li>

<div class="meta">
  <span class="meta__label">
    <img class="meta__logo" src="src/350-logo.png" alt="350" width="28" height="28">
    Us Audience Growth Application
  </span>
</div>

<script type="importmap">
  {
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
    <script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const LINES = [...document.querySelectorAll("#headline span")].map((span) =>
  span.textContent.trim().toUpperCase()
);
const BG = "#e9e9e7";
const INK = "#111111";
const CAMERA_Z = 5;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)")
  .matches;

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.z = CAMERA_Z;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const textCanvas = document.createElement("canvas");
const textCtx = textCanvas.getContext("2d");
let textTexture = null;

const textPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ toneMapped: false })
);
scene.add(textPlane);

// Giraffe rig ported from "CSS 3D Giraffe animated" (MIT, Jan Valkenburg).
// Same box sizes and positions as the glossary giraffe, drawn as one glass body.
const CX = 10;
const LEG = [
  [20, [0, 0, 0], [1, 1, 1]],
  [20, [0, -20, 0], [1, 2, 1]]
];
const LEG_OFF = [
  [-20, 0, 0],
  [20, 0, 0],
  [-20, 0, -80],
  [20, 0, -80]
];
const BODY = [
  [60, [-15, -100, -20], [1.05, 0.9, 2]],
  [20, [0, -90, -110], [1, 1, 1]]
];
const HEAD = [
  [30, [-5, -50, 10], [1, 3.5, 1]],
  [10, [5.25, -15.75, -10], [1, 11.75, 1]],
  [30, [-5, -190, 12.5], [1, 1, 2]],
  [10, [-4, -136, 0], [1, 1.5, 1]],
  [10, [15, -136, 0], [1, 1.5, 1]],
  [10, [57.5, -100, 5], [2, 2, 1]],
  [10, [77.5, -100, 5], [2, 2, 1]],
  [8, [58.75, -99, 7.5], [2, 2, 1]],
  [8, [77.75, -99, 7.5], [2, 2, 1]],
  [10, [91, -183, 20], [3.2, 1, 1]],
  [10, [67.5, -185, 52], [2, 1, 1]]
];

const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0,
  transmission: 1,
  thickness: 0.7,
  ior: 1.45,
  dispersion: 4,
  envMapIntensity: 1,
  toneMapped: false
});

// Dark edges keep the glass silhouette readable on the light background.
const edgeLines = new THREE.LineBasicMaterial({
  color: 0x111111,
  transparent: true,
  opacity: 0.35
});

function giraffeBox([s, t, sc]) {
  const geometry = new THREE.BoxGeometry(s * sc[0], s * sc[1], s * sc[2]);
  const mesh = new THREE.Mesh(geometry, glass);
  mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geometry), edgeLines));
  mesh.position.set(
    135 + sc[0] * (s / 2 + t[0] - 135) - CX,
    -sc[1] * (s / 2 + t[1]),
    sc[2] * t[2]
  );
  return mesh;
}

const giraffe = new THREE.Group();
const giraffeRoot = new THREE.Group();
LEG_OFF.forEach(([x, , z]) => {
  LEG.forEach((b) => {
    const m = giraffeBox(b);
    m.position.x += x;
    m.position.z += z;
    giraffeRoot.add(m);
  });
});
BODY.forEach((b) => giraffeRoot.add(giraffeBox(b)));

const headPivot = new THREE.Group();
const headInner = new THREE.Group();
HEAD.forEach((b) => headInner.add(giraffeBox(b)));
headInner.position.z = -6.6;
headPivot.add(headInner);
headPivot.rotation.x = THREE.MathUtils.degToRad(6);
giraffeRoot.add(headPivot);
giraffe.add(giraffeRoot);

// Re-centre the rig on its own bounds so it turns around its middle.
const rigBox = new THREE.Box3().setFromObject(giraffe);
giraffeRoot.position.copy(rigBox.getCenter(new THREE.Vector3())).negate();
const giraffeHeight = rigBox.max.y - rigBox.min.y;
giraffe.position.z = 2.2;
scene.add(giraffe);

function drawText(width, height) {
  const dpr = Math.min(window.devicePixelRatio, 2);
  textCanvas.width = Math.round(width * dpr);
  textCanvas.height = Math.round(height * dpr);
  textCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  textCtx.fillStyle = BG;
  textCtx.fillRect(0, 0, width, height);
  textCtx.fillStyle = INK;
  textCtx.textAlign = "center";
  textCtx.textBaseline = "middle";

  const maxWidth = width * 0.92;
  const maxHeight = height * 0.78;
  const baseSize = 100;
  const lineGap = 0.98;

  textCtx.font = `900 ${baseSize}px "Inter Tight", sans-serif`;
  const sizes = LINES.map(
    (line) => baseSize * (maxWidth / textCtx.measureText(line).width)
  );
  const totalHeight = sizes.reduce((sum, size) => sum + size * lineGap, 0);
  const fit = Math.min(1, maxHeight / totalHeight);

  let y = height / 2 - (totalHeight * fit) / 2;
  LINES.forEach((line, i) => {
    const size = sizes[i] * fit;
    textCtx.font = `900 ${size}px "Inter Tight", sans-serif`;
    y += (size * lineGap) / 2;
    textCtx.fillText(line, width / 2, y);
    y += (size * lineGap) / 2;
  });

  if (textTexture) {
    textTexture.dispose();
  }
  textTexture = new THREE.CanvasTexture(textCanvas);
  textTexture.colorSpace = THREE.SRGBColorSpace;
  textTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  textPlane.material.map = textTexture;
  textPlane.material.needsUpdate = true;
}

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  renderer.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  const visibleHeight =
    2 * CAMERA_Z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const visibleWidth = visibleHeight * camera.aspect;
  textPlane.scale.set(visibleWidth, visibleHeight, 1);

  // Fit the giraffe to about 70% of the visible height at its depth.
  const giraffeVisibleHeight =
    2 * (CAMERA_Z - giraffe.position.z) *
    Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  giraffe.scale.setScalar((giraffeVisibleHeight * 0.7) / giraffeHeight);

  drawText(width, height);

  if (reducedMotion) {
    render();
  }
}

const pointer = new THREE.Vector2();
window.addEventListener("pointermove", (e) => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = (e.clientY / window.innerHeight) * 2 - 1;
});

const clock = new THREE.Clock();

function render() {
  const t = clock.getElapsedTime();

  if (!reducedMotion) {
    giraffe.rotation.x = pointer.y * 0.1;
    giraffe.rotation.y = 0.45 + Math.sin(t * 0.5) * 0.35 + pointer.x * 0.2;
  } else {
    giraffe.rotation.set(0, 0.45, 0);
  }

  renderer.render(scene, camera);
}

function debounce(fn, delay) {
  let timeoutId;
  return () => {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(fn, delay);
  };
}

const debouncedResize = debounce(resize, 150);

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  debouncedResize();
});

// Redraw the headline once the web font arrives (it may load after first paint).
document.fonts.addEventListener("loadingdone", resize);

document.fonts.ready.then(() => {
  resize();
  if (!reducedMotion) {
    renderer.setAnimationLoop(render);
  }
});
</script>

  </body>
  
</html>
