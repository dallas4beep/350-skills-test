<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="ext-resource-dependency" content="Intro Reel - standalone.html" data-resource-id="reelHtml">
<meta name="ext-resource-dependency" content="Intro Carousel light - standalone.html" data-resource-id="carouselHtml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F5F6F7;font-family:Inter,system-ui,sans-serif}a{color:#2F6E96}a:hover{color:#0D1014}</style>
</helmet>
<template id="__bundler_thumbnail" data-bg-color="#F5F6F7"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect x="200" y="200" width="225" height="400" rx="24" fill="#448CB6"/><rect x="475" y="260" width="525" height="280" rx="24" fill="#0D1014"/><rect x="520" y="300" width="160" height="200" rx="12" fill="#CADDF7"/></svg></template>
<div data-screen-label="Intro set" style="min-height:100vh;background:#F5F6F7;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">
  <div style="font:800 28px Inter,sans-serif;color:#0D1014;letter-spacing:-0.4px">Intro set · Reel + carousel (light)</div>
  <div style="display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font:500 15px Inter,sans-serif;color:#454C51">Reel · 1080 × 1920</div>
      <iframe src="{{ reelSrc }}" title="Intro Reel" style="width:440px;height:800px;border:0;border-radius:16px;background:#F5F6F7;box-shadow:0 10px 30px rgba(13,16,20,.12)"></iframe>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:0">
      <div style="font:500 15px Inter,sans-serif;color:#454C51">Carousel · 1080 × 1350 · 7 slides</div>
      <iframe src="{{ carouselSrc }}" title="Intro carousel, light" style="width:100%;min-width:1000px;height:800px;border:0;border-radius:16px;background:#F5F6F7;box-shadow:0 10px 30px rgba(13,16,20,.12)"></iframe>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const r = window.__resources || {};
    return { reelSrc: r.reelHtml || 'Intro Reel - standalone.html', carouselSrc: r.carouselHtml || 'Intro Carousel light - standalone.html' };
  }
}
</script>
</body>
</html>
