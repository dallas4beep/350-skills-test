<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F5F6F7;font-family:Inter,system-ui,sans-serif}a{color:#2F6E96}a:hover{color:#0D1014}</style>
</helmet>
<div data-screen-label="Intro set" style="min-height:100vh;background:#F5F6F7;padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:24px">
  <div style="font:800 28px Inter,sans-serif;color:#0D1014;letter-spacing:-0.4px">Intro set · Reel + carousel (light)</div>
  <div style="display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font:500 15px Inter,sans-serif;color:#454C51">Reel · 1080 × 1920</div>
      <iframe src="Intro Reel - standalone.html" title="Intro Reel" style="width:440px;height:800px;border:0;border-radius:16px;background:#F5F6F7;box-shadow:0 10px 30px rgba(13,16,20,.12)"></iframe>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:0">
      <div style="font:500 15px Inter,sans-serif;color:#454C51">Carousel · 1080 × 1350 · 7 slides</div>
      <iframe src="Intro Carousel light - standalone.html" title="Intro carousel, light" style="width:100%;min-width:1000px;height:800px;border:0;border-radius:16px;background:#F5F6F7;box-shadow:0 10px 30px rgba(13,16,20,.12)"></iframe>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
